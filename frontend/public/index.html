<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Identify Quran verses from audio recordings using advanced audio fingerprinting technology"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Authentic Quranic Arabic Font Support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Quran Verse Identifier</title>

    <style>
      /* Authentic Quranic typography */
      .font-quran {
        font-family: 'Amiri Quran', 'Scheherazade New', 'Amiri', serif;
        direction: rtl;
        text-align: right;
        line-height: 2.4;
        word-spacing: 2px;
      }

      .arabic {
        font-family: 'Amiri Quran', 'Amiri', serif;
        direction: rtl;
        text-align: right;
      }

      .ayah-end {
        font-family: 'Amiri Quran', 'Amiri', serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #d97706;
        margin: 0 0.4rem;
        user-select: none;
      }

      /* Loading spinner */
      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
