services:
  - type: web
    name: quran-verse-identifier
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PORT
        value: 10000
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: OMP_NUM_THREADS
        value: 1